name: 生成广东珠江订阅源

on:
  schedule:
    - cron: 0 * * * *
  workflow_dispatch:

jobs:
  build:
    name: 生成 zhujiang.m3u
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 生成咪咕源
        continue-on-error: true
        run: |
          python MIGU.py
          python sort_m3u.py

      - name: 筛选并测速
        run: |
          if [ ! -f migu.m3u ]; then
            echo "migu.m3u 未生成，尝试使用仓库内已有文件"
          fi
          ls -la *.m3u || true
          python pick_best.py

      - name: 提交结果
        run: |
          git config --global user.email "github@github.com"
          git config --global user.name "Github Actions"
          if [ -f zhujiang.m3u ]; then
            git add zhujiang.m3u
            if git diff --cached --quiet; then
              echo "无变化，跳过提交"
            else
              git commit -m "Update zhujiang: $(date +'%Y-%m-%d %H:%M:%S') UTC"
              git push
            fi
          else
            echo "未生成 zhujiang.m3u"
            exit 1
          fi
