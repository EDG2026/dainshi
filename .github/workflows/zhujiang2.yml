name: 广东珠江与影视订阅源

on:
  schedule:
    - cron: 0 */6 * * *
  workflow_dispatch:

jobs:
  build:
    name: build zhujiang.m3u
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: setup python
        run: pip install requests

      - name: refresh migu list
        continue-on-error: true
        run: |
          python MIGU.py || true
          python sort_m3u.py || true
          ls -la *.m3u || true

      - name: build playlist
        run: |
          python - <<'PYEOF'
import re, subprocess, time, sys, io

UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36"
TARGETS = [
    ("广东珠江", ["广东珠江频道", "广东珠江", "珠江频道"], ["珠江"]),
    ("广东影视", ["南方影视", "广东影视"], ["南方影视", "广东影视"]),
]

def parse(path):
    ch = []
    with io.open(path, "r", encoding="utf-8", errors="ignore") as f:
        lines = f.read().splitlines()
    i, n = 0, len(lines)
    while i < n:
        s = lines[i].strip()
        if s.startswith("#EXTINF:"):
            url = ""
            j = i + 1
            while j < n and not lines[j].strip().startswith("#EXTINF:"):
                t = lines[j].strip()
                if t and not t.startswith("#"):
                    url = t
                    break
                j += 1
            m = re.search(r",([^,]+)$", s)
            name = m.group(1).strip() if m else ""
            if url:
                ch.append((url, name))
            i = j
            continue
        i += 1
    return ch

def probe(url):
    try:
        r = subprocess.run(
            ["curl", "-sL", "-o", "/dev/null", "-w", "%{http_code}|%{content_type}",
             "--max-time", "15", "-A", UA, url],
            capture_output=True, text=True, timeout=20)
        raw = (r.stdout or "").strip()
        code, ctype = (raw.split("|") + [""])[:2]
        if code != "200":
            return False
        if "mpegurl" not in ctype.lower() and "m3u8" not in ctype.lower():
            return False
        return True
    except Exception:
        return False

if not __import__("os").path.exists("migu.m3u"):
    print("no migu.m3u"); sys.exit(1)

ch = parse("migu.m3u")
print("channels:", len(ch))

out = ["#EXTM3U"]
total = 0
for outname, exact, kws in TARGETS:
    cands = []
    for e in exact:
        cands = [c for c in ch if c[1] == e]
        if cands:
            break
    if not cands:
        for kw in kws:
            cands = [c for c in ch if kw in c[1]]
            if cands:
                break
    print(outname, "candidates:", len(cands))
    good = []
    for url, name in cands:
        if probe(url):
            good.append(url)
            print("  OK ", name)
        else:
            print("  BAD", name)
    for url in good[:2]:
        out.append('#EXTINF:-1 tvg-id="%s" tvg-name="%s" group-title="广东",%s' % (outname, outname, outname))
        out.append(url)
        total += 1

if total == 0:
    print("no working stream"); sys.exit(1)

with io.open("zhujiang.m3u", "w", encoding="utf-8", newline="\n") as f:
    f.write("\n".join(out) + "\n")
print("written", total)
PYEOF
          echo "--- result ---"
          cat zhujiang.m3u || true

      - name: commit
        run: |
          git config user.email "github@github.com"
          git config user.name "Github Actions"
          if [ -f zhujiang.m3u ]; then
            git add zhujiang.m3u
            if git diff --cached --quiet; then
              echo "no change"
            else
              git commit -m "update zhujiang: $(date -u +'%Y-%m-%d %H:%M:%S') UTC"
              git push
            fi
          else
            echo "zhujiang.m3u missing"
            exit 1
          fi
